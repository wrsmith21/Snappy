# Generates Snappy.xcodeproj: `brew install xcodegen && xcodegen generate`
name: Snappy
options:
  bundleIdPrefix: com.wrsmith21
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SnappyCore:
    path: SnappyCore

targets:
  Snappy:
    type: application
    platform: iOS
    sources:
      - Snappy
    dependencies:
      - package: SnappyCore
    info:
      path: Snappy/Info.plist
      properties:
        CFBundleDisplayName: Snappy
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          # Many podcast hosts still serve episode audio over plain http.
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrsmith21.snappy
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
